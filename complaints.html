<!DOCTYPE html>
<html>
<head>
    <title>My Complaints - CivicCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f7f5;
        }

        header {
            background: #087f5b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        h2 {
            color: #087f5b;
            text-align: center;
        }

        .complaint {
            background: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .complaint h3 {
            margin-top: 0;
            color: #087f5b;
        }

        .status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .progress {
            background: #cfe2ff;
            color: #084298;
        }

        .resolved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .escalated {
            background: #f8d7da;
            color: #842029;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏙️ CivicCare</h1>
    <p>My Complaint Tracking</p>
</header>

<div class="container">

    <h2>📋 My Complaints</h2>

    <!-- Firebase complaints will appear here -->
    <div id="complaintsList">
        <p style="text-align:center;">Loading complaints...</p>
    </div>

    <button onclick="newComplaint()">
        📸 Report a New Issue
    </button>

</div>


<script type="module">

    import { db } from "./firebase.js";

    import {
        collection,
        getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const complaintsList = document.getElementById("complaintsList");


    async function loadComplaints() {

        try {

            const querySnapshot =
                await getDocs(collection(db, "complaints"));

            complaintsList.innerHTML = "";


            if (querySnapshot.empty) {

                complaintsList.innerHTML =
                    "<p style='text-align:center;'>No complaints found.</p>";

                return;
            }


            querySnapshot.forEach((doc) => {

                const complaint = doc.data();

                const issue =
                    complaint.issue || "Civic Issue";

                const location =
                    complaint.location || "Location not available";

                const status =
                    complaint.status || "Pending";


                let statusClass = "pending";
                let statusIcon = "🟡";


                if (status === "In Progress") {

                    statusClass = "progress";
                    statusIcon = "🟠";

                } else if (status === "Resolved") {

                    statusClass = "resolved";
                    statusIcon = "🟢";

                } else if (status === "Escalated") {

                    statusClass = "escalated";
                    statusIcon = "🔴";

                }


                const complaintBox =
                    document.createElement("div");

                complaintBox.className = "complaint";


                complaintBox.innerHTML = `

                    <h3>
                        Complaint ID: ${doc.id}
                    </h3>

                    <p>
                        <strong>Issue:</strong>
                        ${issue}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${location}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status ${statusClass}">
                            ${statusIcon} ${status}
                        </span>
                    </p>

                `;


                complaintsList.appendChild(complaintBox);

            });


        } catch (error) {

            console.error(error);

            complaintsList.innerHTML =
                "<p style='text-align:center;color:red;'>Unable to load complaints.</p>";

        }

    }


    loadComplaints();


    window.newComplaint = function() {

        window.location.href = "report.html";

    };

</script>

</body>
</html>
