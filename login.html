<!DOCTYPE html>
<html>
<head>
    <title>Login - CivicCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f7f5;
        }

        header {
            background: #087f5b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .login-box {
            background: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
        }

        .google {
            background: white;
            color: #333;
            border: 1px solid #ccc;
        }

        .forgot {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏙️ CivicCare</h1>
    <p>AI-Powered Civic Issue Reporting</p>
</header>

<div class="login-box">

    <h2>Login</h2>

    <label>📱 Phone Number / Email</label>
    <input type="text" placeholder="Enter phone or email">

    <label>🔑 Password</label>
    <input type="password" placeholder="Enter password">

    <button onclick="login()">Login</button>

    <div class="forgot">
        <a href="#">Forgot Password?</a>
    </div>

    <button class="google" onclick="googleLogin()">
        Continue with Google
    </button>

</div>

<script>

function login() {
    alert("Login button clicked!");
}

function googleLogin() {
    alert("Google login will be connected later.");
}

</script>

</body>
</html>
