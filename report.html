<!DOCTYPE html>
<html>
<head>
    <title>Report an Issue - CivicCare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f7f5;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .form-box {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
        }
    </style>
</head>

<body>

<header>
    <h1>📢 Report a Civic Issue</h1>
    <p>Help improve your city</p>
</header>

<div class="form-box">

    <label>📸 Upload Photo</label>
    <input type="file" accept="image/*">

    <label>🏷️ Issue Type</label>
    <select>
        <option>Select Issue</option>
        <option>Garbage / Waste</option>
        <option>Pothole</option>
        <option>Broken Streetlight</option>
        <option>Water Leakage</option>
        <option>Open Drain</option>
        <option>Other</option>
    </select>

    <label>📝 Description</label>
    <textarea placeholder="Describe the problem..."></textarea>

    <label>📍 Location</label>
    <input type="text" id="location" placeholder="Click the button below">

    <button onclick="getLocation()">📍 Get My Location</button>

    <button onclick="submitComplaint()">📤 Submit Complaint</button>

</div>

<script>

function getLocation() {

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(function(position) {

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            document.getElementById("location").value =
                latitude + ", " + longitude;

        });

    } else {

        alert("Location is not supported by this browser.");

    }
}

function submitComplaint() {

    alert("Complaint submitted successfully! 🎉");

}

</script>

</body>
</html>
